# docker-compose.prod.yml
# Production overrides — không có hot reload, sử dụng pre-built images từ Container Registry
#
# Chạy production:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: "3.9"

services:
  frontend:
    image: ghcr.io/nguyentribaothang/secureai-frontend:${TAG:-latest}
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/nguyentribaothang/secureai-backend:${TAG:-latest}
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ai_server:
    image: ghcr.io/nguyentribaothang/secureai-ai-server:${TAG:-latest}
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    restart: always
    ports: !reset []  # Không expose port 1433 ra internet trong production, chỉ liên lạc nội bộ
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
