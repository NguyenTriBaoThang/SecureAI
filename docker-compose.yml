version: "3.9"

services:
  # ─── Database: Microsoft SQL Server ──────────────────────────────────
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: secureai_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-SecureAI@2026StrongPass!}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - secureai_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P '$$MSSQL_SA_PASSWORD' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── AI Service: FastAPI + PyTorch (BiLSTM + Attention) ──────────────
  ai_server:
    build:
      context: ./secureai_ai
      dockerfile: Dockerfile
    container_name: secureai_ai
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    networks:
      - secureai_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── Backend: ASP.NET Core 10.0 Web API ──────────────────────────────
  backend:
    build:
      context: ./secureai_backend
      dockerfile: Dockerfile
    container_name: secureai_backend
    ports:
      - "7124:7124"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:7124
      - ConnectionStrings__DefaultConnection=Server=db;Database=SecureAI_DB;User Id=sa;Password=${MSSQL_SA_PASSWORD:-SecureAI@2026StrongPass!};TrustServerCertificate=True;
      - Jwt__Secret=${JWT_SECRET:-SECUREAI_SUPER_SECRET_KEY_FOR_LOCAL_DEVELOPMENT_ONLY_AT_LEAST_64_CHARS}
      - Jwt__Issuer=SecureAI
      - Jwt__Audience=SecureAI-Client
      - Jwt__AccessTokenMinutes=480
      - Jwt__RefreshTokenDays=7
      - MlApi__BaseUrl=http://ai_server:8000
      - AllowedOrigins=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
      ai_server:
        condition: service_started
    networks:
      - secureai_net
    restart: unless-stopped

  # ─── Frontend: React 18 + Vite (3D Cyber Theme) ───────────────────────
  frontend:
    build:
      context: ./secureai_frontend
      dockerfile: Dockerfile
    container_name: secureai_frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:7124/api
      - VITE_ML_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - secureai_net
    restart: unless-stopped

networks:
  secureai_net:
    driver: bridge

volumes:
  sqlserver_data:
