name: CI — Build, Lint & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  #  FRONTEND: TypeScript + ESLint + Vite Production Build
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    name: 🌐 Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secureai_frontend

    steps:
      - uses: actions/checkout@v7

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: secureai_frontend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 TypeScript type check
        run: npx tsc --noEmit

      - name: 🧹 ESLint
        run: npm run lint
        continue-on-error: true

      - name: 🏗️ Build production bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:7124/api
          VITE_ML_URL: http://localhost:8000

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: frontend-dist
          path: secureai_frontend/dist
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  #  BACKEND: ASP.NET Core 10 Build & Verify
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    name: ⚙️ Backend (ASP.NET Core 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secureai_backend

    steps:
      - uses: actions/checkout@v7

      - name: ⚙️ Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x

      - name: 📦 Restore dependencies
        run: dotnet restore secureai_backend/secureai_backend.csproj

      - name: 🏗️ Build (Release)
        run: dotnet build secureai_backend/secureai_backend.csproj --no-restore --configuration Release

  # ─────────────────────────────────────────────────────────────────────────────
  #  AI SERVER: Python 3.11 Lint + Import Verification
  # ─────────────────────────────────────────────────────────────────────────────
  ai-server:
    name: 🧠 AI Engine (FastAPI + PyTorch)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secureai_ai

    steps:
      - uses: actions/checkout@v7

      - name: ⚙️ Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: secureai_ai/requirements.txt

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: 🧹 Lint (flake8)
        run: flake8 src/ --max-line-length=120 --ignore=E501,W503,E402
        continue-on-error: true

      - name: ✅ Import check
        run: python -c "from src.main import app; print('SecureAI FastAPI app OK')"
        env:
          PORT: 8000

  # ─────────────────────────────────────────────────────────────────────────────
  #  DOCKER: Container Build Verification (Main branch only)
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build Verification
    runs-on: ubuntu-latest
    needs: [frontend, backend, ai-server]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: secureai_frontend
          push: false
          tags: secureai/frontend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🐳 Build backend image
        uses: docker/build-push-action@v5
        with:
          context: secureai_backend
          push: false
          tags: secureai/backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🐳 Build AI server image
        uses: docker/build-push-action@v5
        with:
          context: secureai_ai
          push: false
          tags: secureai/ai-server:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
