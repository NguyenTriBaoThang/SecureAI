# docker-compose.override.yml
# Tự động được load khi chạy: docker compose up
# Cung cấp hot-reload và dev settings cho môi trường Local Development
#
# Production không dùng file này (dùng -f docker-compose.yml -f docker-compose.prod.yml):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: "3.9"

services:
  # ─── Frontend: hot reload với Vite dev server ────────────────────────
  frontend:
    ports:
      - "5173:5173"
    volumes:
      - ./secureai_frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:7124/api
      - VITE_ML_URL=http://localhost:8000
    command: npm run dev -- --host 0.0.0.0

  # ─── Backend: auto-restart / hot reload khi code thay đổi ─────────────
  backend:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:7124
    volumes:
      - ./secureai_backend:/src
    command: dotnet watch --project /src run --urls http://+:7124

  # ─── AI Server: reload khi Python code hoặc model thay đổi ───────────
  ai_server:
    volumes:
      - ./secureai_ai:/app
      - ./secureai_ai/model:/app/model
    environment:
      - PORT=8000
    command: uvicorn src.main:app --reload --host 0.0.0.0 --port 8000 --log-level debug

  # ─── Database: expose port 1433 để kết nối trực tiếp từ SSMS / Azure Data Studio ──
  db:
    ports:
      - "1433:1433"
